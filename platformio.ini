; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv

; rtl_433_ESP / CC1101 receiver configuration (433.92 MHz, OOK/ASK for remotes)
build_flags =
    -DRF_CC1101
    -DRF_MODULE_FREQUENCY=433.92
    -DRF_MODULE_CS=5
    -DRF_MODULE_GDO0=4
    -DRF_MODULE_GDO2=RADIOLIB_NC
    -DOOK_MODULATION=1
    -DRF_INVERT_OOK=0
    -DMINRSSI=-90
    -DRSSI_THRESHOLD=6
    -DMQTT_MAX_PACKET_SIZE=8192
    -DLOG_LEVEL=LOG_LEVEL_NOTICE

lib_deps =
    https://github.com/NorthernMan54/rtl_433_ESP.git#v0.6.0
    jgromes/RadioLib@^7.7.1
    knolleary/PubSubClient@^2.8.0
